spring.application.name=tpo-prog3

# --- Conexion a Neo4j -------------------------------------------------------
# NUNCA escribir la password aca. Se toma de variables de entorno (ver .env.example).
# Local:  NEO4J_URI=bolt://localhost:7687
# Aura:   NEO4J_URI=neo4j+s://xxxxxxx.databases.neo4j.io
spring.neo4j.uri=${NEO4J_URI:bolt://localhost:7687}
spring.neo4j.authentication.username=${NEO4J_USER:neo4j}
spring.neo4j.authentication.password=${NEO4J_PASSWORD:}

# --- Carga del dominio (zombies en CABA, ver seed/DominioCaba) ---------------
# Se carga solo si la base esta vacia. Para recargar: docker compose down -v
app.seed.enabled=true

# --- Logging ----------------------------------------------------------------
logging.level.uade.prog3.tpo=INFO
